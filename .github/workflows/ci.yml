name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Push a tag like v0.3.1 (matching package.json "version") to publish.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GitHub Packages
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      # Auth: npm trusted publishing (OIDC) once it's set up on npmjs.com; until
      # then (e.g. the very first release) the NPM_TOKEN repo secret is used.
      - run: npm publish --provenance --ignore-scripts # tests already ran in the test job
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Mirror to GitHub Packages so it shows on the repo page. GitHub requires
      # the scope to match the repo owner, so it's published as @<owner>/argus there.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          npm pkg set name="@${OWNER,,}/argus"
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
